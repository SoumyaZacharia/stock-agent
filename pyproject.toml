[project]
name = "stock-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soumyazach", email = "soumya@beebolt.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "requests>=2.34.2",
    "tenacity>=9.2.1",
    "yfinance>=1.8.0",
]

[project.scripts]
stock-agent = "stock_agent.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
